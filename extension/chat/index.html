<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF Copilot · 对话</title><link rel="stylesheet" href="../common/tokens.css"><link rel="stylesheet" href="../common/motion.css"><link rel="stylesheet" href="../vendor/katex/katex.min.css"><link rel="stylesheet" href="chat.css"></head>
<body>
  <header class="chat-header">
    <span class="brand-mark" aria-hidden="true"><svg class="icon icon-sm"><use href="../common/icons.svg#i-sparkle"></use></svg></span>
    <strong id="heading">PDF Copilot</strong>
    <div class="font-controls" role="group" aria-label="回复字号">
      <button id="font-smaller" type="button" aria-label="减小回复字号" title="减小回复字号">A−</button>
      <button id="font-reset" type="button" title="恢复默认字号">17</button>
      <button id="font-larger" type="button" aria-label="增大回复字号" title="增大回复字号">A+</button>
    </div>
    <details id="chat-menu" class="chat-menu">
      <summary aria-label="更多操作" title="更多操作"><svg class="icon" aria-hidden="true"><use href="../common/icons.svg#i-more"></use></svg></summary>
      <div class="menu-actions">
        <button id="reader" type="button"><svg class="icon icon-sm" aria-hidden="true"><use href="../common/icons.svg#i-doc-open"></use></svg>增强阅读器</button>
        <button id="quick" type="button"><svg class="icon icon-sm" aria-hidden="true"><use href="../common/icons.svg#i-chat"></use></svg>临时问答</button>
        <button id="clear" type="button"><svg class="icon icon-sm" aria-hidden="true"><use href="../common/icons.svg#i-close"></use></svg>清空会话</button>
        <button id="settings" type="button"><svg class="icon icon-sm" aria-hidden="true"><use href="../common/icons.svg#i-fit-width"></use></svg>模型与密钥设置</button>
      </div>
    </details>
  </header>
  <div class="source"><span id="source-name">当前文档</span><span id="task-summary" hidden aria-live="polite"></span><small id="mode-note" class="sr-only">会话和附件仅保留在内存中</small></div>
  <details id="model-options" class="model-options">
    <summary title="调整服务、模型和思考强度"><svg class="icon icon-sm" aria-hidden="true"><use href="../common/icons.svg#i-fit-width"></use></svg><span id="model-summary">模型设置</span><span class="disclosure-arrow" aria-hidden="true"><svg class="icon icon-sm"><use href="../common/icons.svg#i-chevron-down"></use></svg></span></summary>
    <div class="options-body collapsible">
      <div class="model-row">
        <label>服务<select id="provider"></select></label>
        <div class="effort-field"><label for="effort">思考强度</label><span class="effort-controls"><select id="effort"></select><button id="refresh" type="button" class="icon-button" title="从本机 Codex 获取模型" aria-label="刷新 Codex 模型"><svg class="icon icon-sm" aria-hidden="true"><use href="../common/icons.svg#i-refresh"></use></svg></button></span></div>
        <label class="model-field">模型<input id="model" list="models" placeholder="输入模型 ID"><datalist id="models"></datalist></label>
      </div>
    </div>
  </details>
  <main id="messages" aria-live="polite"></main>
  <div id="attachments" class="attachments"></div>
  <form id="composer">
    <div class="input-card">
      <textarea id="prompt" rows="2" placeholder="这页在讲什么？（Ctrl+Enter 发送）" aria-label="对话内容" aria-describedby="context-hint"></textarea>
      <div class="composer-actions"><button id="capture" type="button" title="框选需要解释的公式或图表"><svg class="icon icon-sm" aria-hidden="true"><use href="../common/icons.svg#i-crop"></use></svg>截图</button><span class="spacer"></span><button id="stop" type="button" hidden><svg class="icon icon-sm" aria-hidden="true"><use href="../common/icons.svg#i-stop"></use></svg>停止</button><button id="send" class="primary" type="submit" disabled>发送<svg class="icon icon-sm" aria-hidden="true"><use href="../common/icons.svg#i-send"></use></svg></button></div>
    </div>
    <div class="context-strip"><label id="pdf-context-control" class="pdf-context-control" hidden title="开启后，直接提问附当前页；已有附件时使用附件。增强模式下 AI 还可按需查阅相关页。整份 PDF 不上传。"><input id="pdf-context" type="checkbox">自动上下文</label><span id="context-hint"></span></div>
    <div id="status" class="status" role="status" aria-live="polite"></div>
  </form>
  <script type="module" src="chat.js"></script>
</body></html>
